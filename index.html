.primary{background:var(--green);color:#fff}.secondary{background:#eee;color:#222}.danger{background:#e53935;color:#fff}

.status{font-weight:800;padding:3px 7px;border-radius:999px;font-size:10px}.s1{background:#e4f7ea;color:#159447}.s0{background:#fff8cf;color:#b69a00}.se{background:#ffe3e3;color:#d62929}.sb{background:#eee;color:#555}
.buttons{display:flex;gap:6px;margin-top:8px}.buttons button{flex:1;border-radius:7px;padding:8px 4px;font-weight:800}.bisa{color:#159447;background:#fff;border:1px solid #9bd8b2}.penuh{color:#c7a400;background:#fff;border:1px solid #e6d36a}.error{color:#d62929;background:#fff;border:1px solid #e6a0a0}.clear{color:#555;background:#fff;border:1px solid #bbb}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:7px;text-align:center}th{background:#e9f8ed}
.small{font-size:12px;color:#666}.hidden{display:none}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:8px;z-index:20;display:none}

.print-preview{overflow-x:auto;background:#f3f5f3;padding:10px}

.calendar-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px}.calendar-wrap input{padding:8px 10px;border:1px solid #bbb;border-radius:8px;font-size:13px;font-weight:700}.datebar{display:flex;gap:5px;overflow-x:auto;padding:4px 0 9px}

.datebar button.active{background:#19c653;color:#fff;border-color:#19c653}

.manual-actions button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}

.page-mark-notice{margin:2px 0 4px;padding:7px 10px;border-radius:9px;background:#eaf4ff;border:1px solid #9bc7f5;color:#155a96;text-align:center;font-weight:800;font-size:12px;min-height:18px}
.page-mark-notice:empty{display:none}
</style>

<style>

function latestStatus(m,val){

 if(!arr.length)return null;

async function loadRecap(d){
 d=+d;
 const counts={b:0,p:0,e:0};
 // Rekap kumulatif: hanya hilangkan baris yang benar-benar merupakan
 // duplikasi penyimpanan: NIK sama, tanggal sama, status sama, dan timestamp sama.
 // Input yang waktunya berbeda tetap dipertahankan karena merupakan input nyata.
 const uniqueCumulative=new Map();
 inputs.forEach(x=>{
   if(x.year===selectedYear && x.month===selectedMonth && +x.tanggal<=d && x.nilai){
     const nik=String(x.nik||'').trim();
     const ts=new Date(x.updated_at||0).getTime();
     const key=`${nik}|${x.tanggal}|${x.nilai}|${Number.isFinite(ts)?Math.floor(ts/1000):x.data_gas_id}`;
     if(!uniqueCumulative.has(key)) uniqueCumulative.set(key,x);
   }
 });
 uniqueCumulative.forEach(x=>{
   if(x.nilai==='1') counts.b++;
   else if(x.nilai==='0') counts.p++;
   else if(x.nilai==='-') counts.e++;
 });
 const total=counts.b+counts.p+counts.e;
 // MASIH BISA DIINPUT = jumlah NIK unik yang benar-benar masih memenuhi syarat.
 // PENUH/ERROR satu kali saja sudah cukup untuk mengeluarkan NIK tersebut
 // dari daftar, walaupun status itu muncul berkali-kali pada tanggal lain.
 const masihBisaDiinput=members.filter(m=>{
   // Gunakan aturan INPUT yang sama, termasuk jarak 5 hari lintas bulan.
   const r=rules(m,d);
   return !r.bisaDisabled;
 }).length;
 document.getElementById('rekapStats').innerHTML=`<div class="rekap-stat"><b>JML BISA</b><strong>${counts.b}</strong><span>tgl 1–${d}</span></div><div class="rekap-stat"><b>PENUH</b><strong>${counts.p}</strong><span>tgl 1–${d}</span></div><div class="rekap-stat"><b>ERROR</b><strong>${counts.e}</strong><span>tgl 1–${d}</span></div><div class="rekap-stat can-input"><b>MASIH BISA DIINPUT</b><strong>${masihBisaDiinput} NIK</strong><span>Belum ada input pada tanggal ${d} dan sudah lewat minimal 5 hari sejak BISA terakhir.</span></div>`;
 const cal=document.getElementById('rekapCalendar');
 if(cal){
   const y=selectedYear, m=String(selectedMonth).padStart(2,'0'), dd=String(d).padStart(2,'0');
   cal.value=`${y}-${m}-${dd}`;
 }
 // Hanya hitung input yang benar-benar tercatat pada tanggal tersebut (WIB).
 // Ini mencegah data lama/hasil update database ikut masuk ke jumlah harian.
 const expectedDate=`${selectedYear}-${String(selectedMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const dailyMap=new Map();
 inputs.forEach(x=>{
   if(+x.tanggal!==d || x.year!==selectedYear || x.month!==selectedMonth || x.nilai!==recapFilter || !x.updated_at) return;
   const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(x.updated_at));
   const y=parts.find(p=>p.type==='year')?.value, mo=parts.find(p=>p.type==='month')?.value, da=parts.find(p=>p.type==='day')?.value;
   if(`${y}-${mo}-${da}`!==expectedDate) return;
   // Duplikasi hanya jika NIK + status + timestamp benar-benar sama.
   // Jadi kita tidak membuang input sah hanya karena NIK yang sama.
   const ts=new Date(x.updated_at).getTime();
   const key=`${String(x.nik||'').trim()}|${x.nilai}|${Number.isFinite(ts)?Math.floor(ts/1000):x.data_gas_id}`;
   if(!dailyMap.has(key)) dailyMap.set(key,x);
 });
 const daily=Array.from(dailyMap.values()).sort((a,b)=>new Date(a.updated_at)-new Date(b.updated_at));
 const rows=daily.map((x,i)=>{const ts=x.updated_at;return `<tr><td>${i+1}</td><td class="nama">${esc(x.nama)}</td><td class="nik">${esc(x.nik)}</td><td>Hal ${esc(String(x.halaman).replace(/^HAL\s*/i,''))}</td><td>${ts?formatWIB(ts):'-'}</td></tr>`}).join('');
 const label=recapFilter==='1'?'BISA':recapFilter==='0'?'PENUH':'ERROR';
 document.getElementById('recapBody').innerHTML=`<div class="recap-filter"><button data-value="1" class="${recapFilter==='1'?'active':''}" onclick="setRecapFilter('1')">BISA</button><button data-value="0" class="${recapFilter==='0'?'active':''}" onclick="setRecapFilter('0')">PENUH</button><button data-value="-" class="${recapFilter==='-'?'active':''}" onclick="setRecapFilter('-')">ERROR</button></div><div class="small" style="text-align:center;margin:5px 0 8px">Tanggal ${d} • ${label} • ${daily.length} data</div><div class="rekap-table-wrap"><table class="rekap-table"><tr><th>NO</th><th>NAMA</th><th>NIK</th><th>HALAMAN</th><th>WAKTU DIINPUT</th></tr>${rows||`<tr><td colspan="5">Tidak ada data ${label} pada tanggal ${d}</td></tr>`}</table></div>`;
}

async function autoMark(){
  const n=Math.max(1,Number(document.getElementById("markCount")?.value)||1);

  const eligible=members.filter(m=>{
    if(m.ditandai)return false;
    const r=rules(m,currentDate);
    if(r.penuh||r.hasError||r.bisaBlockedByGap)return false;
    if(getVal(m,currentDate))return false;
    return true;
  });
  if(!eligible.length){toast("Tidak ada NIK yang bisa ditandai");return}

  const memberInputs=m=>inputs.filter(x=>+x.halaman===+m.halaman&&+x.no===+m.no);
  const countAll=m=>memberInputs(m).filter(x=>x.nilai!=="").length;
  const countBisa=m=>memberInputs(m).filter(x=>x.nilai==="1").length;
  const lastInputDate=m=>{
    const ds=memberInputs(m).map(x=>+x.tanggal).filter(Number.isFinite);
    return ds.length?Math.max(...ds):0;
  };

  // Tetap mengikuti prosedur HASANAH:
  // 1. input paling sedikit
  // 2. BISA paling sedikit
  // 3. input terakhir paling lama
  // 4. jika semuanya sama, gunakan acak.
  const byPriority=new Map();
  for(const m of eligible){
    const key=`${countAll(m)}|${countBisa(m)}|${lastInputDate(m)}`;
    if(!byPriority.has(key))byPriority.set(key,[]);
    byPriority.get(key).push(m);
  }

  // Acak kandidat yang memiliki prioritas sama.
  const shuffle=arr=>{
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  };

  // Urutkan kelompok berdasarkan prosedur prioritas, lalu acak di dalam kelompok.
  const groups=[...byPriority.entries()].sort((a,b)=>{
    const A=a[0].split("|").map(Number), B=b[0].split("|").map(Number);
    return A[0]-B[0] || A[1]-B[1] || A[2]-B[2];
  });
  groups.forEach(g=>shuffle(g[1]));

  // Ambil kandidat secara tersebar antar halaman.
  // Halaman diputar mulai dari titik acak agar tidak selalu mulai Hal 1.
  const pageMap=new Map();
  for(const g of groups){
    for(const m of g[1]){
      if(!pageMap.has(m.halaman))pageMap.set(m.halaman,[]);
      pageMap.get(m.halaman).push(m);
    }
  }
  const pages=[...pageMap.keys()].sort((a,b)=>+a-+b);
  const start=Math.floor(Math.random()*pages.length);
  const rotated=pages.slice(start).concat(pages.slice(0,start));

  const ordered=[];
  let remaining=true, round=0;
  while(remaining){
    remaining=false;
    const roundPages=shuffle(rotated.slice());
    for(const pg of roundPages){
      const arr=pageMap.get(pg)||[];
      if(arr[round]){
        ordered.push(arr[round]);
        remaining=true;
      }
    }
    round++;
  }

  // Jika prioritas sangat berbeda, tetap prioritaskan kelompok lebih tinggi.
  // Kandidat final dipilih dari ordered; tidak lagi berdasarkan nomor NIK.
  const pick=ordered.slice(0,n);

  let ok=0,gagal=0;
  const gagalNama=[];
  for(const m of pick){
    if(m.ditandai||getVal(m,currentDate))continue;
    const r=rules(m,currentDate);
    if(r.penuh||r.hasError||r.bisaBlockedByGap)continue;
    try{
      await api(`/rest/v1/data_gas?id=eq.${encodeURIComponent(m.id)}`,{
        method:"PATCH",
        headers:{Prefer:"return=minimal"},
        body:JSON.stringify({ditandai:true})
      });
      m.ditandai=true;
      ok++;
    }catch(e){
      gagal++;
      if(gagalNama.length<3)gagalNama.push(m.nama);
    }
  }

  renderMarks();renderMembers();updateMarkInfo();updatePageMarkNotice();
  if(gagal){
    toast(`${ok} NIK ditandai • ${gagal} gagal${gagalNama.length?" • "+gagalNama.join(", "):""}`);
  }else{
    toast(`${ok} NIK ditandai secara acak`);
  }
}

  return `<table class="print-grid"><thead>
    <tr><th class="no">No</th><th class="name">Nama Pembeli</th><th class="nik">NIK Pembeli</th><th class="cat">Kategori</th>${printDayHeaders()}<th class="row-total">Total</th></tr>
  </thead><tbody>${printRows(page)}</tbody><tfoot><tr><th colspan="4">TOTAL</th>${printDayTotals(page)}<th>${inputs.filter(i=>+i.halaman===+page&&i.year===selectedYear&&i.month===selectedMonth&&i.nilai==='1').length}</th></tr></tfoot></table>${footerHtml}`;
}
function printPage1(page){
  return `<div class="print-sheet print-sheet-first">
    <div class="print-title">CATATAN PENJUALAN HARIAN PANGKALAN LPG 3KG</div>
    <div class="print-head-wrap">
      <div class="print-head-left">
        <div><b>Nama Pangkalan</b> : RIAN</div>
        <div><b>No. Reg Pangkalan</b> : ____________________</div>
        <div><b>Alamat</b> : ________________________________</div>
        <div><b>MID LPG MAP</b> : ____________________________</div>
        <div><b>Nama Agen Penyuplai</b> : PT. SUMITA DAYA KELOLA</div>
        <div><b>Bulan</b> : ${monthName(selectedYear,selectedMonth).toUpperCase()} ${selectedYear}</div>
      </div>
      <div class="print-head-right">
        <div><b>Jumlah Nama Pembeli</b> : 690</div>
        <div><b>RT</b> : ____________ &nbsp;&nbsp; <b>UM</b> : ____________ &nbsp;&nbsp; <b>TOTAL</b> : ____________</div>
        <div>Rumah Tangga : ................................................ tbg</div>
        <div>Usaha Mikro &nbsp;&nbsp;: ................................................ tbg</div>
        <div class="head-total"><b>TOTAL</b> : ........................................ tbg</div>
      </div>
    </div>
    <table class="stock-grid"><tr><th>TANGGAL</th>${printDayHeaders()}<th>Total</th></tr><tr><th>Stok Awal</th>${Array(31).fill('<td></td>').join('')}<td></td></tr><tr><th>Penerimaan</th>${Array(31).fill('<td></td>').join('')}<td></td></tr></table>
    ${printBaseTable(page)}
    <div class="print-page-number">Halaman 1</div>
  </div>`;
}
function printMiddlePage(page){
  return `<div class="print-sheet print-sheet-middle">
    ${printBaseTable(page)}
    <div class="print-page-number">Halaman ${page}</div>
  </div>`;
}
function printPage28(page){
  const total=inputs.filter(i=>+i.halaman===+page&&i.year===selectedYear&&i.month===selectedMonth&&i.nilai==='1').length;
  return `<div class="print-sheet print-sheet-last">
    ${printBaseTable(page,`<table class="print-last-summary"><tr><th>TOTAL PENJUALAN</th><td>${total}</td></tr><tr><th>Stok Akhir</th><td></td></tr><tr><th>Tabung Kosong</th><td></td></tr></table><div class="print-note"><b>Keterangan</b><br>NIK : Nomor Induk Kependudukan</div>`)}
    <div class="print-page-number">Halaman 28</div>
  </div>`;
}
function printSheetForPage(page){
  page=Number(String(page).replace(/^HAL\s*/i,''))||1;
  if(page===1)return printPage1(page);
  if(page===28)return printPage28(page);
  return printMiddlePage(page);
}
function loadPrint(){document.getElementById("printBody").innerHTML=`<div class="print-preview">${printSheetForPage(currentPrintPage)}</div>`}
function openPrintWindow(html){
  try{
    let old=document.getElementById("printOverlay");
    if(old) old.remove();
    const overlay=document.createElement("div");
    overlay.id="printOverlay";
    overlay.innerHTML=`
      <div class="print-overlay-toolbar">
        <button class="do-print" type="button" onclick="window.print()">🖨️ CETAK / PRINT</button>
        <button class="do-close" type="button" onclick="closePrintOverlay()">KEMBALI</button>
      </div>
      <div class="print-overlay-content"><div class="print-preview">${html}</div></div>`;
    document.body.appendChild(overlay);
    document.body.classList.add("printing-preview");
    window.scrollTo({top:0,behavior:"auto"});
  }catch(e){toast("Menu cetak tidak tersedia: "+e.message);}
}
function closePrintOverlay(){
  const o=document.getElementById("printOverlay");
  if(o)o.remove();
  document.body.classList.remove("printing-preview");
}
function printPage(page){
  currentPrintPage=Number(page)||1;
  buildPageBar(pages());
  loadPrint();
  openPrintWindow(printSheetForPage(currentPrintPage));
}
function printAllPages(){
  const sheets=pages().map(p=>printSheetForPage(p)).join('');
  document.getElementById("printBody").innerHTML=`<div class="print-preview">${sheets}</div>`;
  openPrintWindow(sheets);
}

document.getElementById("search").addEventListener("input",renderMembers);
init();
</script>
</body>
